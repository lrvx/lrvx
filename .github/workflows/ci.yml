name: Build and Test

on:
  # main, plus audit-* integration branches (e.g. audit-2026-09): pushes
  # straight to one of these are PR merges into a branch nothing else opens
  # a PR against, so they never got a CI run of their own -- each merged PR
  # was only ever checked against the base it was tested on, never against
  # what the merge before it just changed. Two branches can each be green
  # in isolation and still break the integration branch when combined; nothing
  # ran to notice.
  #
  # audit/* and followup/* feature branches are deliberately left out: they
  # do have an open PR, so adding them here would run the whole matrix twice
  # (once for push, once for pull_request) -- 32 checks where 16 is the real
  # coverage. audit-* has no open PR against itself, so it doesn't double up.
  push:
    branches: [main, 'audit-*']
  pull_request:
  schedule:
    # Weekly affinity tests - Sunday at 3:00 UTC
    - cron: '0 3 * * 0'

permissions:
  contents: read

# Fast-fail: a new push to the same branch / PR cancels the in-progress run.
# Build jobs (linux-*, macos, windows-*, sanitizers) depend on the quick
# format-check job (~15s), so a formatting failure no longer leaves the
# multi-OS matrix burning cycles.
#
# verify-docs-current (~3.5 min) used to also sit in that `needs`, which
# meant an 11-job matrix couldn't start requesting runners until both gates
# cleared. It runs in parallel with the matrix now, not ahead of it -- its
# own status check still has to go green, it just no longer holds the
# matrix's start line.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    # Observed: ~15s.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5

    - name: Install clang-format
      # Pinned to an exact version via the PyPI wheel instead of
      # `apt-get install clang-format` (whatever the distro currently
      # ships): the pin lives in scripts/clang-format-version.sh, the one
      # place scripts/check-format.sh and scripts/pre-commit also read it
      # from, so CI's baseline can't drift out from under either without
      # a deliberate change to that file.
      run: |
        . scripts/clang-format-version.sh
        python3 -m pip install --break-system-packages "clang-format==${CLANG_FORMAT_REQUIRED_VERSION}"

    - name: Check formatting
      run: ./scripts/check-format.sh

  verify-docs-current:
    runs-on: ubuntu-latest
    # Observed: ~3 min.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Verify indicator docs are in sync with registry.def
      run: |
        python3 scripts/gen_indicator_docs.py
        if ! git diff --exit-code -- docs/; then
          echo "::error::docs/ out of sync with include/lrvx/indicator/registry.def"
          echo "Run: python3 scripts/gen_indicator_docs.py"
          exit 1
        fi
    - name: Verify llms.txt and llms-full.txt are in sync with docs/
      run: python3 scripts/gen_llms_txt.py --check
    - name: Verify node/index.d.ts exports match the C++ binding
      run: python3 scripts/check_dts_exports.py
    - name: Verify node/index.d.ts class members cover every NAPI wrap method
      run: python3 scripts/check_dts_class_members.py
    - name: Verify cross-binding parity (pybind11/napi/codon/quickjs)
      # --require-quickjs is the script's default and is passed explicitly
      # here: the flag used to exist and never be passed, which left 59 of the
      # 73 IDL groups unchecked against the QuickJS layer while the step
      # reported success. A flag that is never passed is not a gate.
      run: |
        pip install pyyaml
        python3 scripts/check_binding_parity.py --require-quickjs
    - name: Run the binding-gate tests
      # The gates are only as honest as these: each builds a miniature
      # repository, removes one wrapper, and requires the gate to go red.
      # Without them a gate can stop checking and stay green forever.
      run: |
        pip install pyyaml pytest
        python3 -m pytest scripts/tests -q
    - name: Verify error codes have docs and pages aren't stale
      run: python3 scripts/check_error_codes.py
    - name: Verify test gating against backtest / capi headers
      run: python3 scripts/check_test_gating.py
    - name: Verify no thread body can terminate the process
      run: python3 scripts/check_thread_bodies_contained.py
    # A std::unordered_map enumerates in bucket order, and bucket order is a
    # property of the library, not of the data. The golden replay caught one
    # that reached the event stream (an emergency cancel publishing its
    # conditionals in hash order, identical state on both libraries), and it
    # could only catch it because it runs on both. This is the cheap half:
    # every traversal in venue/include has to carry the verdict someone
    # reached about it, so the next one is written by somebody who found out
    # whether their order is observable.
    - name: Verify every unordered traversal in the venue says why its order is safe
      run: python3 scripts/check_iteration_order.py

    - name: Verify every test file is reachable by the suite runners
      run: python3 scripts/check_suite_discovery.py

    # The same defect recurred three times: a Codon example
    # counted as coverage while CI never ran it. This is a static check (no
    # Codon compiler needed) so it belongs here rather than in the build
    # jobs -- every codon/examples/*.codon file must be named by the smoke
    # loop, the direct-run step, a known external gate, or a reasoned
    # entry in the script's own EXCEPTIONS list.
    - name: Verify every Codon example runs in CI or is a listed exception
      run: python3 scripts/check_codon_examples_coverage.py

    # Same defect, fourth time, this time on the QuickJS side:
    # merged_tape_smoke.js and run_trace_smoke.js shipped and were never
    # added to the "Verify QuickJS runner" step below, so nothing in CI
    # ever ran them. Also a static check -- every quickjs/examples/*.js
    # file must be named by that step or a reasoned entry in the script's
    # own EXCEPTIONS list.
    - name: Verify every QuickJS example runs in CI or is a listed exception
      run: python3 scripts/check_quickjs_examples_coverage.py

    # The QuickJS call sites are strings inside C++ string literals, so the
    # compiler cannot see a global that was never registered. setQueueFifoTopN
    # shipped that way and every call was a ReferenceError.
    - name: Verify every QuickJS global the JS layer calls is registered
      run: python3 scripts/check_quickjs_registration.py

    # JS_ToCString returns null for a Symbol or a throwing toString, and a
    # binding that skips the test hands that null to strlen. The test was
    # missing at most call sites until the owning holder replaced them.
    - name: Verify QuickJS string conversions go through the guarded holder
      run: python3 scripts/check_quickjs_tocstring.py
    - name: Verify Python API index is in sync with .pyi
      run: python3 scripts/gen_api_index.py --check
    - name: Verify doc snippets follow the --8<-- include pattern
      run: |
        # Ratchet floor: 24 `--8<--` includes today (4% of 481 typed
        # blocks). Migration target is 50% coverage. Bump the floor
        # in this step every time a PR successfully migrates more
        # snippets — never lower it.
        python3 scripts/check_doc_snippets.py --min-includes 24
    - name: Verify every API symbol named in hand-written docs exists
      run: python3 scripts/check_doc_symbols.py
    - name: Verify self-contained C++ Strategy examples in docs compile
      # check_doc_symbols.py only proves a named symbol still exists, not
      # that its signature still matches the doc's claim -- three
      # reference pages survived a real field/return-type change with
      # every doc gate green. This compiles every full Strategy example
      # against the real headers with -fsyntax-only, so a worked example
      # calling a method whose signature moved underneath it fails here
      # instead of shipping silently. Scope: full class-definition
      # examples only, not single-line signature/field fragments -- see
      # the script's own docstring for what remains unchecked.
      run: python3 scripts/check_doc_cpp_examples.py
    - name: Verify docs/examples/* still run (or at least parse)
      run: python3 scripts/check_doc_examples.py
    - name: Verify every doc page is reachable from the mkdocs nav
      run: python3 scripts/check_doc_nav.py
    - name: Verify relative doc links and anchors resolve
      run: python3 scripts/check_doc_links.py
    - name: Verify doc conventions (package names, build flags, no emoji)
      run: python3 scripts/check_doc_conventions.py
    - name: Verify lrvx-mcp bundled data is in sync
      run: |
        # IR snapshot is built from the IDL via libclang, plus the
        # binding manifest reads binding_parity.yaml — both deps need
        # to be present in this job for --check to run end-to-end.
        python3 -m pip install --break-system-packages libclang pyyaml
        python3 scripts/sync_mcp_data.py --check
    - name: Dependency ranges match between package and CI
      # lrvx-mcp shipped `mcp>=1.0` while this file installed `mcp>=1.0,<2`, so
      # CI was green on 1.x and users got the 2.0 SDK, which crashes on start.
      run: python3 scripts/check_dep_pins.py

    - name: Verify the sanitizer transcript scan is wired into every job that needs it
      # `ctest --output-on-failure` prints the output of the tests it decided
      # had failed, so a sanitizer report inside a test whose assertions
      # passed never reaches the log. Twice in the 2026-09 audit a real defect
      # was found that way. This keeps the scan wired in: a job that builds
      # with -fsanitize= has to run its tests and binaries through
      # scripts/run-with-sanitizer-scan.sh.
      run: |
        python3 scripts/scan_sanitizer_reports.py --self-test
        python3 scripts/check_sanitizer_scan.py

    - name: Build lrvx (needed by mcp/tests)
      # lrvx_mcp's bundled-data-reader and runtime-tool tests import
      # lrvx; without a build on PYTHONPATH, 19 mcp/tests cases skip and
      # the job's own "N passed, M skipped" summary reads identical to fully
      # healthy either way. The suite refuses to pass in that state now (see
      # mcp/tests/conftest.py), so a failure of this step surfaces there.
      # Mirrors linux-gcc's configure/build, minus the bindings this job
      # doesn't need.
      run: |
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake ninja-build g++-14
        python3 -m pip install --break-system-packages "pybind11<3.1.0" numpy
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_BUILD_PYTHON=ON \
              -DLRVX_ENABLE_BACKTEST=ON \
              -Dpybind11_DIR="$(python3 -c 'import pybind11; print(pybind11.get_cmake_dir())')"
        cmake --build build -j$(nproc)

    - name: lrvx-mcp unit tests
      # `mcp` was never installed, so lrvx_mcp.server was unimportable and
      # nothing tested the 38 tool schemas or the dispatch chain that has to
      # match them. test_tool_dispatch.py needs it.
      #
      # LRVX_MCP_REQUIRE_DEPS makes a missing dependency fail the step instead
      # of shrinking the run: without the binding the suite drops 19 cases and
      # still reports a green summary, so the step above could stop producing
      # an importable module and nothing here would say so. mcp/tests/
      # conftest.py already infers this from CI=true; naming it here keeps the
      # requirement greppable from the workflow.
      env:
        LRVX_MCP_REQUIRE_DEPS: '1'
      run: |
        # Keep this range identical to mcp/pyproject.toml; check_dep_pins.py
        # enforces that.
        python3 -m pip install --break-system-packages pytest "mcp>=2.0,<3"
        PYTHONPATH=build/python python3 -m pytest mcp/tests/ -q

  linux-gcc:
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Observed: ~15-20 min normally; this is the job that hung for hours on
    # PR #470 (one step never released a threaded Runner's ThreadSafeFunction,
    # keeping the process alive with nothing left to do).
    # Observed: about 30 min since the test suite grew past 320 binaries plus
    # the Python and Node steps, so 30 cut the demo step off; 45 leaves the
    # hang guard in place with a margin.
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ccache defaults to comparing the compiler binary's mtime, and
      # apt-get gives g++-14/clang-18 a fresh mtime on every ephemeral
      # runner -- so the mtime check "changes" on every run even though
      # the package (and its content) is identical, and ccache treats it
      # as a different compiler and misses everything. content hashes the
      # actual bytes instead, which is stable across runners. (sccache on
      # the Windows jobs already hashes content by default -- this brings
      # ccache in line with it.)
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build liblz4-dev g++-14 python3-dev python3-pip ccache

    # Keyed on compiler + a hash of every CMakeLists.txt: a CMake-option
    # change invalidates the cache (compiler flags are part of what ccache
    # hashes anyway, so this key doesn't need to enumerate them), while an
    # unrelated source change keeps hitting it. restore-keys falls back to
    # the newest same-compiler cache when the exact key misses, so a cache
    # entry is never truly cold after the first run on this branch's base.
    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-gcc14-linux-gcc-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-gcc14-linux-gcc-

    - name: Install Python packages
      # pybind11-stubgen pinned below 3.0: 3.0.0 reorders the generated
      # stubs, so an unpinned install drifts against the committed .pyi the
      # moment a new release lands, with no change in the repository.
      # pybind11 pinned below 3.1.0: 3.1.0 changed the signatures stubgen
      # renders, so the committed .pyi (generated with 3.0.x) drifts against
      # an unpinned install. Bump this pin together with a stub regeneration.
      # scipy is the only workflow that installs it: LiveQueueCalibrator's
      # continuous-fit method is lazy-import-optional, and without scipy
      # here test_fit_scipy_matches_or_beats_grid_rmse always skips while
      # its mirror (missing-dependency error message) always passes, so the
      # suite summary reads clean either way.
      run: python3 -m pip install --break-system-packages "pybind11<3.1.0" numpy scipy "pybind11-stubgen<3" mypy pyright pytest

    - name: Install Codon
      env:
        CODON_VERSION: v0.19.6
      run: |
        mkdir -p ~/.codon && cd ~/.codon
        curl -fsSL "https://github.com/exaloop/codon/releases/download/${CODON_VERSION}/codon-linux-x86_64.tar.gz" \
          | tar zxf - --strip-components=1
        echo "$HOME/.codon/bin" >> $GITHUB_PATH

    - name: Build and Install GoogleTest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_INSTALL_PREFIX=~/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Build and Install Google Benchmark
      run: |
        git clone --depth=1 https://github.com/google/benchmark.git
        cmake -B benchmark-build -S benchmark -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON \
          -DCMAKE_INSTALL_PREFIX=~/benchmark-install
        cmake --build benchmark-build
        cmake --install benchmark-build

    # LRVX_NATIVE=OFF: CMakeLists.txt defaults Release builds to
    # -march=native, which is safe only when the machine that compiled an
    # object is the machine that runs it. ccache breaks that: a cache hit
    # can hand this job an object gcc built on a *different* runner in an
    # earlier run, and if that runner's CPU had an instruction this one
    # lacks, every test linking it dies with SIGILL on startup -- caught
    # in review as a 100%-cache-hit run where ~250 of 277 tests failed
    # with "Exception: Illegal". x86-64-v3 (this option's OFF fallback)
    # is a fixed baseline every runner in the fleet satisfies, so a cached
    # object is safe to run anywhere. Same reasoning as this flag's other
    # OFF caller, the distributable wheel build.
    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_NATIVE=OFF \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install;$HOME/benchmark-install" \
              -Dpybind11_DIR="$(python3 -c 'import pybind11; print(pybind11.get_cmake_dir())')" \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_BUILD_BENCHMARKS=ON \
              -DLRVX_BUILD_DEMO=ON \
              -DLRVX_ENABLE_LZ4=ON \
              -DLRVX_ENABLE_BACKTEST=ON \
              -DLRVX_BUILD_CAPI=ON \
              -DLRVX_BUILD_PYTHON=ON \
              -DLRVX_BUILD_CODON=ON \
              -DLRVX_BUILD_QUICKJS=ON \
              -DLRVX_BUILD_TOOLS=ON

    - name: ccache zero stats
      run: ccache -z

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Build Node.js addon
      working-directory: node
      env:
        CXX: g++-14
        CC: gcc-14
      run: npm install && npm run build

    - name: Type-check node/index.d.ts
      working-directory: node
      run: npm run typecheck

    - name: Run tests
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Verify C API
      run: |
        test -f build/src/capi/liblrvx_capi.so
        nm -D build/src/capi/liblrvx_capi.so | grep -q lrvx_emit_market_buy
        nm -D build/src/capi/liblrvx_capi.so | grep -q lrvx_position_tracker_on_fill
        nm -D build/src/capi/liblrvx_capi.so | grep -q lrvx_order_tracker_on_submitted

    # The whole suite, not a hand-listed subset. This used to be ~35 named
    # steps, one per file, so any test file nobody remembered to add here
    # simply never ran -- 34 of 69 files at the time this changed, including
    # every regression gate added for the binding audit. scripts/
    # check_suite_discovery.py fails CI if a test file is not reachable.
    # check_binding_parity.py asserts a symbol exists; this calls it. Every
    # defect the binding audit found had an existing symbol, so the name gate
    # could not see any of them.
    - name: Binding smoke (call the surface, not just name it)
      run: PYTHONPATH=build/python python3 scripts/check_binding_smoke.py

    - name: Python test suite
      run: PYTHONPATH=build/python python3 -m pytest python/tests -q

    - name: Replay-equivalence CI gate
      run: python3 scripts/replay_equivalence_gate.py

    - name: Cross-binding .lrvxrun parity gate
      run: python3 scripts/lrvxrun_byte_identical_gate.py

    - name: Verify .pyi stubs are in sync with the binding
      run: python3 scripts/gen_pyi_stubs.py --check

    # Build the wheel from the root pyproject.toml, install it into a
    # throwaway venv, and assert every documented pure-Python module is
    # importable. Catches the regression where scikit-build-core only
    # collects the install component contents and silently drops new
    # `.py` files added under `python/lrvx/`.
    - name: Verify wheel ships every pure-Python module
      run: bash scripts/check_lrvx_wheel.sh

    - name: Type-check Python examples with mypy
      run: PYTHONPATH=build/python python3 -m mypy --ignore-missing-imports
        docs/examples/python_backtest_vs_live.py
        docs/examples/python_multi_symbol.py
        docs/examples/python_ccxt_live.py
        docs/examples/python_tape_roundtrip.py
        docs/examples/python_binance_archive.py
        docs/examples/python_binance_book_archive.py
        docs/examples/python_bybit_archive.py
        docs/examples/python_okx_archive.py
        docs/examples/python_bitget_archive.py
        docs/examples/python_deribit_archive.py
        docs/examples/python_orderbook_iterator.py
        docs/examples/python_rolling_top_k.py
        docs/examples/python_xs_panel.py
        docs/examples/python_rate_limit_aware_market_maker.py
        docs/examples/python_options_pricing.py
        docs/examples/python_options_greeks.py

    # Pyright is what Cursor / Pylance / VSCode actually run; mypy and
    # pyright sometimes disagree, and the AI-DX goal is the editor
    # experience. The CCXT example is excluded because ccxt itself ships
    # without typing for its primary surface and pyright (unlike mypy)
    # has no global "ignore missing imports" mode that's safe to use.
    - name: Type-check Python examples with pyright
      run: PYTHONPATH=build/python python3 -m pyright
        docs/examples/python_backtest_vs_live.py
        docs/examples/python_multi_symbol.py

    - name: Run Python example
      run: PYTHONPATH=build/python python3 docs/examples/python_backtest_vs_live.py

    - name: Run Python tape round-trip example
      run: PYTHONPATH=build/python python3 docs/examples/python_tape_roundtrip.py

    - name: Run Python options pricing example
      run: PYTHONPATH=build/python python3 docs/examples/python_options_pricing.py

    - name: Run Python options greeks example
      run: PYTHONPATH=build/python python3 docs/examples/python_options_greeks.py

    - name: Run Python Binance archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_binance_archive.py

    - name: Run Python Binance book archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_binance_book_archive.py

    - name: Run Python Bybit archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_bybit_archive.py

    - name: Run Python OKX archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_okx_archive.py

    - name: Run Python Bitget archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_bitget_archive.py

    - name: Run Python Deribit archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_deribit_archive.py

    - name: Run Python OrderBookIterator example
      run: PYTHONPATH=build/python python3 docs/examples/python_orderbook_iterator.py

    - name: Run Python rolling top-K example
      run: PYTHONPATH=build/python python3 docs/examples/python_rolling_top_k.py

    - name: Run Python cross-sectional panel example
      run: PYTHONPATH=build/python python3 docs/examples/python_xs_panel.py

    - name: Run Python rate-limit-aware market maker example
      run: PYTHONPATH=build/python python3 docs/examples/python_rate_limit_aware_market_maker.py

    # The named steps above cover a hand-picked subset. This one executes
    # *every* docs/examples/*.py (minus the explicit skip-list in the
    # script), so a new example is covered the moment it lands. The docs-only
    # job runs the same gate without a build, where it degrades to a syntax
    # check; --require-runtime makes the missing extension a failure here.
    - name: Run every doc example against the built bindings
      run: PYTHONPATH=build/python python3 scripts/check_doc_examples.py --require-runtime

    - name: RL env→paper alpha-decay gate (synthetic)
      run: PYTHONPATH=build/python python3 scripts/rl_alpha_decay_gate.py --max-decay 0.30

    - name: Verify Codon binaries
      run: |
        test -f build/codon/codon_sma_crossover
        test -f build/codon/codon_pairs_strategy
        test -f build/codon/codon_backtest_from_csv
        test -f build/codon/codon_full_backtest
        test -f build/codon/codon_strategy_dispatch_smoke
        test -f build/codon/codon_backtest_vs_live
        file build/codon/codon_sma_crossover | grep -q ELF

    - name: Run Codon examples
      run: |
        LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
          ./build/codon/codon_full_backtest
        LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
          ./build/codon/codon_backtest_from_csv docs/examples/data/btcusdt_1m.csv
        LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
          ./build/codon/codon_backtest_vs_live
        LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
          ./build/codon/codon_threaded_gc_stress

    # These print "ok"/"FAIL" per check and most do not raise or exit
    # nonzero on a failed one, so checking only the process exit code is
    # blind to a failing check -- codon_delta_book_smoke printed
    # "FAIL replayer delta: 2 2" and exited 0 under the old form of this
    # step for as long as the file existed. Capture each binary's output
    # and fail the step on either a nonzero exit or a FAIL line in it.
    - name: Run Codon smoke examples
      run: |
        set +e
        fail=0
        for bin in codon_latency_smoke codon_tape_diff_smoke \
                   codon_portfolio_risk_smoke codon_execution_algos_smoke \
                   codon_delta_book_smoke codon_order_book_window_smoke \
                   codon_composite_book_smoke codon_bar_close_ordering_parity_smoke \
                   codon_order_type_codes_smoke codon_indicator_bounds_smoke \
                   codon_signal_fields_smoke codon_aggregate_bars_smoke \
                   codon_strategy_dispatch_smoke codon_graph_smoke \
                   codon_streaming_graph_smoke codon_adf_smoke \
                   codon_autocorrelation_smoke codon_backtest_run_tapes_smoke \
                   codon_composite_dsl_smoke codon_feed_clock_smoke \
                   codon_merged_tape_smoke codon_multi_tf_helpers_smoke \
                   codon_order_group_smoke codon_run_trace_smoke \
                   codon_strategy_e2e_smoke codon_targets_smoke \
                   codon_trace_attach_smoke codon_sma_crossover \
                   codon_pairs_strategy; do
          echo "── $bin"
          out=$(LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
                "./build/codon/$bin" 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "!! $bin exited with code $rc"
            fail=1
          fi
          if echo "$out" | grep -qE '(^|[^A-Za-z])FAIL'; then
            echo "!! $bin printed a FAIL line above (its exit code alone did not catch this)"
            fail=1
          fi
        done
        exit $fail

    - name: Verify QuickJS runner
      run: |
        test -f build/src/quickjs/lrvx_js_runner
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/sma_crossover.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/backtest_sma.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/latency_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/tape_diff_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/portfolio_risk_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/execution_algos_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/delta_book_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/order_book_window_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/order_group_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/bar_close_ordering_parity_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/renko_gap_bricks_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/pairs_strategy_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/merged_tape_smoke.js
        ./build/src/quickjs/lrvx_js_runner quickjs/examples/run_trace_smoke.js

    # Every test_*.js, not a hand-listed subset (9 of 21 files were unrun).
    # byte_identical_fixture.js is a fixture helper, not a test, and is
    # excluded by the test_ prefix.
    - name: Node.js test suite
      run: |
        cd node
        fail=0
        for f in test/test_*.js; do
          echo "── $f"
          node "$f" || fail=1
        done
        exit $fail

    - name: Verify Node.js TypeScript authoring layer
      run: |
        cd node
        npx tsc -p authoring/tsconfig.json
        npx tsc -p test/tsconfig.authoring.json
        node .test-build/test_authoring.js

    # `npm run typecheck` (above) only runs `tsc --noEmit` on test_types.ts,
    # which confirms every call matches index.d.ts but never executes the
    # calls -- a declared type that drifted from what the addon actually
    # accepts at runtime passes tsc and then throws (or silently returns
    # the wrong JS type) the first time real code runs. Compile it to JS
    # and run it against the built addon so that drift fails CI.
    - name: Run node/test/test_types.ts against the built addon
      run: |
        cd node
        npx tsc -p test/tsconfig.types.json
        node .test-build/test_types.js

    - name: Cross-binding parity (Python ↔ Node, same C++ math)
      run: PYTHONPATH=build/python python3 scripts/cross_binding_parity.py

    - name: Run Node.js example
      run: node docs/examples/node_backtest_vs_live.js

    # This one is about the process ending, not about its output: it sets no
    # exit code of its own and forces no exit, so a step that finishes at all
    # is the assertion. A threaded Runner that failed to hand the event loop
    # back would hang here instead, which is what the step is for.
    - name: Run Node.js threaded-runner lifetime example
      timeout-minutes: 2
      run: node docs/examples/node_threaded_runner_lifetime.js

    - name: Run demo
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/lrvx_demo

    # Benchmarks still compile every run (LRVX_BUILD_BENCHMARKS=ON above), so
    # a benchmark that stops building fails this job either way. Only
    # *running* them (the 4-5 min this step costs) moves off the PR path:
    # bench-nightly.yml runs them on a schedule and on workflow_dispatch: a PR
    # gets the compile check for free, a `bench`-labeled PR or the nightly
    # run gets the numbers.
    - name: Run benchmarks
      if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
      run: ./scripts/run-benchmarks.sh build/benchmarks

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  linux-clang:
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Observed: about 30 min since the test suite grew past 320 binaries (the
    # build alone takes 23 on a cold cache), so 30 cut ctest off mid-run; 45
    # leaves a margin.
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ccache defaults to comparing the compiler binary's mtime, and
      # apt-get gives g++-14/clang-18 a fresh mtime on every ephemeral
      # runner -- so the mtime check "changes" on every run even though
      # the package (and its content) is identical, and ccache treats it
      # as a different compiler and misses everything. content hashes the
      # actual bytes instead, which is stable across runners. (sccache on
      # the Windows jobs already hashes content by default -- this brings
      # ccache in line with it.)
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v5

    - name: Install LLVM repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build liblz4-dev clang-18 libc++-18-dev libc++abi-18-dev ccache

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-clang18-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-clang18-

    - name: Build and Install GoogleTest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fexperimental-library" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=~/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Build and Install Google Benchmark
      run: |
        git clone --depth=1 https://github.com/google/benchmark.git
        cmake -B benchmark-build -S benchmark -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fexperimental-library" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON \
          -DCMAKE_INSTALL_PREFIX=~/benchmark-install
        cmake --build benchmark-build
        cmake --install benchmark-build

    # LRVX_NATIVE=OFF: see linux-gcc's identical Configure step -- ccache
    # can hand this job an object compiled with -march=native on a
    # different runner, and running it here can SIGILL. OFF pins to the
    # x86-64-v3 baseline every runner satisfies.
    - name: Configure
      run: |
        rm -rf build
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fexperimental-library" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_NATIVE=OFF \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install;$HOME/benchmark-install" \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_BUILD_BENCHMARKS=ON \
              -DLRVX_BUILD_DEMO=ON \
              -DLRVX_ENABLE_LZ4=ON \
              -DLRVX_ENABLE_BACKTEST=ON \
              -DLRVX_BUILD_CAPI=ON

    - name: ccache zero stats
      run: ccache -z

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Run tests
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Run demo
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/lrvx_demo

    # See linux-gcc's identical step: benchmarks still compile every run,
    # only running them moves to bench-nightly.yml / a `bench`-labeled PR.
    - name: Run benchmarks
      if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
      run: ./scripts/run-benchmarks.sh build/benchmarks

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  sanitizers:
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Observed: ~11-15 min per sanitizer.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ccache defaults to comparing the compiler binary's mtime, and
      # apt-get gives g++-14/clang-18 a fresh mtime on every ephemeral
      # runner -- so the mtime check "changes" on every run even though
      # the package (and its content) is identical, and ccache treats it
      # as a different compiler and misses everything. content hashes the
      # actual bytes instead, which is stable across runners. (sccache on
      # the Windows jobs already hashes content by default -- this brings
      # ccache in line with it.)
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build liblz4-dev g++-14 ccache

    # A separate key per sanitizer, not a shared gcc14 key: the -fsanitize=
    # flag is baked into every translation unit ccache hashes, so a shared
    # key would just be three sanitizers fighting over the same slots with
    # no hit-rate benefit -- separating them means each stays warm on its
    # own restore-keys prefix instead of getting evicted by the other two.
    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-gcc14-sanitizer-${{ matrix.sanitizer }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-gcc14-sanitizer-${{ matrix.sanitizer }}-

    - name: Build and Install GoogleTest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_INSTALL_PREFIX=~/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Configure with sanitizer
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install" \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_BUILD_BENCHMARKS=OFF \
              -DLRVX_BUILD_DEMO=ON \
              -DLRVX_ENABLE_LZ4=ON \
              -DLRVX_ENABLE_BACKTEST=ON \
              -DLRVX_BUILD_CAPI=ON \
              -DLRVX_BUILD_QUICKJS=ON

    - name: ccache zero stats
      run: ccache -z

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Run tests with sanitizer
      # ThreadSanitizer had no options of its own here and ran on its
      # defaults. They are spelled out now: keep going after a race so one
      # run reports every race rather than the first, and keep the nonzero
      # exit as a second line of defence behind the transcript scan.
      #
      # UBSAN_OPTIONS carries abort_on_error=1 now, matching ASAN_OPTIONS.
      # Without it, halt_on_error=1 on Linux calls a plain _exit(), which
      # skips every signal handler -- including the one Python's own
      # faulthandler installs to print a diagnosable crash report. The
      # process would just vanish with exit code 1 and nothing in the
      # transcript to scan. abort_on_error=1 raises SIGABRT instead, so a
      # halt is diagnosable the same way a memory-safety abort already is.
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:abort_on_error=1
        TSAN_OPTIONS: halt_on_error=0:exitcode=66:second_deadlock_stack=1
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Run demo with sanitizer
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:abort_on_error=1
        TSAN_OPTIONS: halt_on_error=0:exitcode=66:second_deadlock_stack=1
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/lrvx_demo

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  macos:
    needs: [format-check]
    runs-on: macos-latest
    # Observed: ~7-8 min plain, +119% with the undefined-behavior sanitizer
    # (~15 min) -- still at or below linux-gcc, the longest job in the
    # matrix, so this does not lengthen the overall run. LeakSanitizer and
    # ThreadSanitizer stay off this job: ASan leak detection is unsupported
    # on Darwin (silently ignored) and TSan is covered on Linux already, so
    # only UBSan is worth the macOS runner cost here.
    # Observed: about 30 min on a cold cache since the test suite grew past
    # 320 binaries (the cap cancelled the job in the middle of linking), so
    # 45 leaves a margin, as for linux-gcc and linux-clang.
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ccache defaults to comparing the compiler binary's mtime, and
      # apt-get gives g++-14/clang-18 a fresh mtime on every ephemeral
      # runner -- so the mtime check "changes" on every run even though
      # the package (and its content) is identical, and ccache treats it
      # as a different compiler and misses everything. content hashes the
      # actual bytes instead, which is stable across runners. (sccache on
      # the Windows jobs already hashes content by default -- this brings
      # ccache in line with it.)
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: brew install cmake ninja lz4 ccache

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-appleclang-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-appleclang-

    - name: Build and Install GoogleTest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_INSTALL_PREFIX=~/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Build and Install Google Benchmark
      run: |
        git clone --depth=1 https://github.com/google/benchmark.git
        cmake -B benchmark-build -S benchmark -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON \
          -DCMAKE_INSTALL_PREFIX=~/benchmark-install
        cmake --build benchmark-build
        cmake --install benchmark-build

    # LRVX_NATIVE=OFF: see linux-gcc's identical Configure step -- this is
    # still a CONFIG:Release build (the sanitizer flags above don't change
    # that), so it's just as exposed to a ccache hit serving an object
    # compiled -march=native on a differently-provisioned macOS runner.
    - name: Configure
      run: |
        LZ4_PREFIX=$(brew --prefix lz4)
        cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DLRVX_NATIVE=OFF \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install;$HOME/benchmark-install;$LZ4_PREFIX" \
              -DCMAKE_LIBRARY_PATH="$LZ4_PREFIX/lib" \
              -DCMAKE_INCLUDE_PATH="$LZ4_PREFIX/include" \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_BUILD_BENCHMARKS=ON \
              -DLRVX_BUILD_DEMO=ON \
              -DLRVX_ENABLE_LZ4=ON \
              -DLRVX_ENABLE_BACKTEST=ON \
              -DLRVX_BUILD_TOOLS=ON

    - name: ccache zero stats
      run: ccache -z

    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Run tests with undefined-behavior sanitizer
      env:
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Run demo with undefined-behavior sanitizer
      env:
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/lrvx_demo

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  windows-msvc:
    needs: [format-check]
    runs-on: windows-latest
    # Observed: ~13 min. The step-level timeout-minutes below is separate --
    # that one bounds a single flaky-network step, not the whole job.
    timeout-minutes: 30

    env:
      # The VC++ telemetry uploader touches freshly linked binaries and
      # has been observed holding a .exe long enough for the next ninja
      # link step to fail with "being used by another process". Nothing
      # in CI needs it.
      VSCMD_SKIP_SENDTELEMETRY: 1
      VCPKG_DISABLE_METRICS: 1
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
    - uses: actions/checkout@v5

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # Retried like the vcpkg installs below: choco's own community feed
    # has timed out mid-run here (504 from community.chocolatey.org),
    # same class of flaky network dependency as vcpkg.exe/portfile
    # downloads, so it gets the same backoff instead of failing the job
    # on one bad response.
    - name: Install ninja and sccache
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        for ($i = 1; $i -le 3; $i++) {
          choco install ninja sccache -y
          if ($LASTEXITCODE -eq 0) { break }
          Write-Host "::warning::choco install ninja sccache failed (attempt $i/3, exit $LASTEXITCODE)"
          if ($i -lt 3) { Start-Sleep -Seconds (20 * $i) }
        }
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::choco install ninja sccache failed after 3 attempts"
          exit 1
        }

    # cl.exe's default Release config carries no /Zi (no shared PDB), which
    # is the one MSVC + sccache combination known to race under parallel
    # compilation -- so this is the same restore/build/save shape as the
    # ccache jobs above, not a riskier variant of it.
    - name: Restore sccache
      id: sccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-${{ runner.os }}-msvc-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          sccache-${{ runner.os }}-msvc-

    # Every one of these three steps reaches the network, and all three have
    # failed on us mid-run (vcpkg.exe download, portfile download). Retry with
    # backoff, and cap the step so a hung download fails in minutes instead of
    # sitting at the job's default limit.
    #
    # Retries alone were not enough: three attempts against a 502 still fail,
    # and burn twenty-five minutes doing it. The binary cache is the actual
    # fix -- after the first run the packages come out of the GitHub Actions
    # cache and the source archives are never fetched at all.
    - name: Export the Actions cache endpoint for vcpkg
      uses: actions/github-script@v7
      with:
        script: |
          // vcpkg's x-gha provider reads these two out of the environment,
          // and the runner only exposes them to actions, not to run steps.
          // Newer runners name the endpoint ACTIONS_RESULTS_URL; export
          // whichever is present so this does not quietly stop caching when
          // the runner image moves.
          const url = process.env.ACTIONS_CACHE_URL || process.env.ACTIONS_RESULTS_URL || '';
          core.exportVariable('ACTIONS_CACHE_URL', url);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
          if (!url) { core.warning('no Actions cache endpoint: vcpkg will build from source'); }
    - name: Install vcpkg dependencies
      timeout-minutes: 25
      shell: pwsh
      env:
        VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        # vcpkg release 2026.07.29. A tag, resolved to its commit, so the
        # toolchain is the same on every run and the cache key is stable.
        VCPKG_PIN: 'c76c06644034521fb761a39f8f52d8e87d1103d5'
      run: |
        $ErrorActionPreference = 'Continue'
        function Invoke-WithRetry {
          param([string]$What, [int]$Attempts, [scriptblock]$Action)
          for ($i = 1; $i -le $Attempts; $i++) {
            & $Action
            if ($LASTEXITCODE -eq 0) { return }
            Write-Host "::warning::$What failed (attempt $i/$Attempts, exit $LASTEXITCODE)"
            if ($i -lt $Attempts) { Start-Sleep -Seconds (20 * $i) }
          }
          Write-Host "::error::$What failed after $Attempts attempts"
          exit 1
        }
        if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
        # Pinned, not floating HEAD. A clone of whatever vcpkg is today gives a
        # different toolchain on every run, so the binary cache would miss
        # every time and the archives would be re-downloaded anyway -- which is
        # the failure this exists to stop.
        #
        # Fetching the one commit rather than cloning: vcpkg's full history is
        # around a gigabyte, and pulling it every run would trade a flaky
        # download for a slow certain one.
        New-Item -ItemType Directory -Path vcpkg | Out-Null
        git -C vcpkg init -q
        git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
        Invoke-WithRetry 'fetch vcpkg pin' 3 { git -C vcpkg fetch --depth 1 -q origin $env:VCPKG_PIN }
        Invoke-WithRetry 'checkout vcpkg pin' 3 { git -C vcpkg checkout -q FETCH_HEAD }
        Invoke-WithRetry 'bootstrap-vcpkg' 3 { .\vcpkg\bootstrap-vcpkg.bat }
        Invoke-WithRetry 'vcpkg install' 3 { .\vcpkg\vcpkg install lz4:x64-windows gtest:x64-windows benchmark:x64-windows }

    - name: Configure
      run: |
        cmake -B build -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
              -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
              -DLRVX_BUILD_TESTS=ON `
              -DLRVX_BUILD_BENCHMARKS=ON `
              -DLRVX_BUILD_DEMO=ON `
              -DLRVX_ENABLE_LZ4=ON `
              -DLRVX_ENABLE_BACKTEST=ON

    - name: sccache zero stats
      run: sccache -z

    - name: Build
      # Retried once, Windows only. Parallel linking of ~150 test executables
      # intermittently loses one to "the process cannot access the file because
      # it is being used by another process" -- a file lock, not a build error.
      # ninja is incremental, so a real compile or link error re-fails in
      # seconds on the second attempt and still fails the job; only the lock
      # clears. This masks nothing deterministic.
      run: |
        cmake --build build -j $env:NUMBER_OF_PROCESSORS
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::build failed once; retrying in case a linker output was locked"
          cmake --build build -j $env:NUMBER_OF_PROCESSORS
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: sccache stats
      if: always()
      run: sccache --show-stats

    - name: Run tests
      run: ctest --output-on-failure --test-dir build

    - name: Run demo
      run: .\build\demo\lrvx_demo.exe

    - name: Save sccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  windows-clang-cl:
    needs: [format-check]
    runs-on: windows-latest
    # Observed: ~7 min.
    timeout-minutes: 25

    env:
      # The VC++ telemetry uploader touches freshly linked binaries and
      # has been observed holding a .exe long enough for the next ninja
      # link step to fail with "being used by another process". Nothing
      # in CI needs it.
      VSCMD_SKIP_SENDTELEMETRY: 1
      VCPKG_DISABLE_METRICS: 1
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
    - uses: actions/checkout@v5

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # Retried like windows-msvc's identical step and the vcpkg installs
    # below: choco's own feed is a flaky network dependency too.
    - name: Install dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        for ($i = 1; $i -le 3; $i++) {
          choco install ninja llvm sccache -y
          if ($LASTEXITCODE -eq 0) { break }
          Write-Host "::warning::choco install ninja llvm sccache failed (attempt $i/3, exit $LASTEXITCODE)"
          if ($i -lt 3) { Start-Sleep -Seconds (20 * $i) }
        }
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::choco install ninja llvm sccache failed after 3 attempts"
          exit 1
        }

    - name: Restore sccache
      id: sccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-${{ runner.os }}-clangcl-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          sccache-${{ runner.os }}-clangcl-

    # Every one of these three steps reaches the network, and all three have
    # failed on us mid-run (vcpkg.exe download, portfile download). Retry with
    # backoff, and cap the step so a hung download fails in minutes instead of
    # sitting at the job's default limit.
    #
    # Retries alone were not enough: three attempts against a 502 still fail,
    # and burn twenty-five minutes doing it. The binary cache is the actual
    # fix -- after the first run the packages come out of the GitHub Actions
    # cache and the source archives are never fetched at all.
    - name: Export the Actions cache endpoint for vcpkg
      uses: actions/github-script@v7
      with:
        script: |
          // vcpkg's x-gha provider reads these two out of the environment,
          // and the runner only exposes them to actions, not to run steps.
          // Newer runners name the endpoint ACTIONS_RESULTS_URL; export
          // whichever is present so this does not quietly stop caching when
          // the runner image moves.
          const url = process.env.ACTIONS_CACHE_URL || process.env.ACTIONS_RESULTS_URL || '';
          core.exportVariable('ACTIONS_CACHE_URL', url);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
          if (!url) { core.warning('no Actions cache endpoint: vcpkg will build from source'); }
    - name: Install vcpkg dependencies
      timeout-minutes: 25
      shell: pwsh
      env:
        VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        # vcpkg release 2026.07.29. A tag, resolved to its commit, so the
        # toolchain is the same on every run and the cache key is stable.
        VCPKG_PIN: 'c76c06644034521fb761a39f8f52d8e87d1103d5'
      run: |
        $ErrorActionPreference = 'Continue'
        function Invoke-WithRetry {
          param([string]$What, [int]$Attempts, [scriptblock]$Action)
          for ($i = 1; $i -le $Attempts; $i++) {
            & $Action
            if ($LASTEXITCODE -eq 0) { return }
            Write-Host "::warning::$What failed (attempt $i/$Attempts, exit $LASTEXITCODE)"
            if ($i -lt $Attempts) { Start-Sleep -Seconds (20 * $i) }
          }
          Write-Host "::error::$What failed after $Attempts attempts"
          exit 1
        }
        if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
        # Pinned, not floating HEAD. A clone of whatever vcpkg is today gives a
        # different toolchain on every run, so the binary cache would miss
        # every time and the archives would be re-downloaded anyway -- which is
        # the failure this exists to stop.
        #
        # Fetching the one commit rather than cloning: vcpkg's full history is
        # around a gigabyte, and pulling it every run would trade a flaky
        # download for a slow certain one.
        New-Item -ItemType Directory -Path vcpkg | Out-Null
        git -C vcpkg init -q
        git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
        Invoke-WithRetry 'fetch vcpkg pin' 3 { git -C vcpkg fetch --depth 1 -q origin $env:VCPKG_PIN }
        Invoke-WithRetry 'checkout vcpkg pin' 3 { git -C vcpkg checkout -q FETCH_HEAD }
        Invoke-WithRetry 'bootstrap-vcpkg' 3 { .\vcpkg\bootstrap-vcpkg.bat }
        # No gtest here on purpose: this job builds it from source
        # (LRVX_FETCH_GTEST) because clang-cl and cl disagree about which
        # types exist. vcpkg puts its include directory ahead of any
        # target's, so a gtest left installed would be the one compiled
        # against while the one built here is the one linked, and the two
        # are different versions. Installing it is what makes that
        # possible, so it is not installed.
        Invoke-WithRetry 'vcpkg install' 3 { .\vcpkg\vcpkg install lz4:x64-windows benchmark:x64-windows }

    - name: Configure with clang-cl
      run: |
        cmake -B build -G Ninja `
              -DCMAKE_C_COMPILER=clang-cl `
              -DCMAKE_CXX_COMPILER=clang-cl `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
              -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
              -DLRVX_BUILD_TESTS=ON `
              -DLRVX_FETCH_GTEST=ON `
              -DLRVX_BUILD_BENCHMARKS=ON `
              -DLRVX_BUILD_DEMO=ON `
              -DLRVX_ENABLE_LZ4=ON `
              -DLRVX_ENABLE_BACKTEST=ON

    - name: sccache zero stats
      run: sccache -z

    - name: Build
      # Retried once, Windows only. Parallel linking of ~150 test executables
      # intermittently loses one to "the process cannot access the file because
      # it is being used by another process" -- a file lock, not a build error.
      # ninja is incremental, so a real compile or link error re-fails in
      # seconds on the second attempt and still fails the job; only the lock
      # clears. This masks nothing deterministic.
      run: |
        cmake --build build -j $env:NUMBER_OF_PROCESSORS
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::build failed once; retrying in case a linker output was locked"
          cmake --build build -j $env:NUMBER_OF_PROCESSORS
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: sccache stats
      if: always()
      run: sccache --show-stats

    - name: Run tests
      run: ctest --output-on-failure --test-dir build

    - name: Run demo
      run: .\build\demo\lrvx_demo.exe

    - name: Save sccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  # Weekly affinity tests (Linux only)
  affinity-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    # Weekly-only; not on the PR critical path. Build + full suite + demo +
    # benchmarks, comparable to linux-gcc/linux-clang.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build liblz4-dev libnuma-dev g++-14

    - name: Build and Install GoogleTest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_INSTALL_PREFIX=~/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Build and Install Google Benchmark
      run: |
        git clone --depth=1 https://github.com/google/benchmark.git
        cmake -B benchmark-build -S benchmark -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON \
          -DCMAKE_INSTALL_PREFIX=~/benchmark-install
        cmake --build benchmark-build
        cmake --install benchmark-build

    - name: Configure with CPU affinity
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install;$HOME/benchmark-install" \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_BUILD_BENCHMARKS=ON \
              -DLRVX_BUILD_DEMO=ON \
              -DLRVX_ENABLE_LZ4=ON \
              -DLRVX_ENABLE_CPU_AFFINITY=ON \
              -DLRVX_ENABLE_BACKTEST=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run all tests including affinity
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Run demo
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/lrvx_demo

    - name: Run benchmarks
      run: ./scripts/run-benchmarks.sh build/benchmarks

  connectors-build:
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Observed: ~11 min on a warm ccache. LRVX_BUILD_TESTS=ON below pulls
    # every core and venue test into this build too, so a cold cache on a
    # slow runner needs about 25 min for the compile and LTO links alone;
    # 40 leaves that case room.
    timeout-minutes: 40
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ccache defaults to comparing the compiler binary's mtime, and
      # apt-get gives g++-14/clang-18 a fresh mtime on every ephemeral
      # runner -- so the mtime check "changes" on every run even though
      # the package (and its content) is identical, and ccache treats it
      # as a different compiler and misses everything. content hashes the
      # actual bytes instead, which is stable across runners. (sccache on
      # the Windows jobs already hashes content by default -- this brings
      # ccache in line with it.)
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 ccache \
                                libssl-dev zlib1g-dev libcurl4-openssl-dev

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-gcc14-connectors-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-gcc14-connectors-

    - name: Install GoogleTest
      # connectors/tests/CMakeLists.txt requires it (find_package(GTest
      # REQUIRED)) once LRVX_BUILD_TESTS pulls that directory in below.
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_INSTALL_PREFIX=$HOME/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    # Network deps (ixwebsocket, simdjson) come in via FetchContent
    # at configure time. Polymarket Rust FFI is opt-OUT here so the
    # job doesn't need a Rust toolchain. LRVX_BUILD_TESTS is required
    # alongside LRVX_BUILD_CONNECTORS: connectors/CMakeLists.txt only
    # adds its own tests/ subdirectory when that flag is on, so without
    # it the unit_test_* targets never exist for ctest to run -- no
    # workflow set both flags together before this.
    # LRVX_NATIVE=OFF: see linux-gcc's identical Configure step.
    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_NATIVE=OFF \
              -DCMAKE_PREFIX_PATH=$HOME/gtest-install \
              -DLRVX_BUILD_CONNECTORS=ON \
              -DLRVX_ENABLE_POLYMARKET_ORDER_EXECUTOR=OFF \
              -DLRVX_BUILD_TESTS=ON

    - name: ccache zero stats
      run: ccache -z

    - name: Build connectors target and tests
      run: cmake --build build -j$(nproc)

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Verify static archive exists
      run: test -f build/connectors/liblrvx-connectors.a

    - name: Run connector unit tests
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  # The venue module must stay genuinely optional: a build with it OFF has to
  # configure, compile and pass its suite with no venue code involved. Cheap
  # job, but it is the only thing that stops the OFF path from rotting.
  # Static proof that every handler reaching the matcher applies its pre-trade
  # gates first. Property tests can only assert this for the paths someone
  # enumerated; this asserts it over the code, so a new path cannot skip a
  # check silently. Configure only -- the check reads compile_commands.json and
  # never needs a compiled object.
  venue-gate-reachability:
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Observed: ~30s (configure only, no build).
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang-18 libgtest-dev libgmock-dev
        pip install libclang

    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_BUILD_VENUE=ON \
              -DLRVX_BUILD_TESTS=ON

    - name: Prove every path into matching applies its gates
      run: python3 scripts/check_gate_reachability.py

    - name: Exhaustively check the checkpoint/recovery protocol
      run: python3 scripts/check_recovery_model.py

  # venue-optional (venue OFF entirely) and venue-engine-only (venue ON,
  # network perimeter OFF) used to be two separate jobs. Both are cheap
  # (4-5 min each) but each claimed its own ubuntu-24.04 runner the moment
  # the gate opened, and with eleven jobs doing that at once, sanitizers
  # (thread)/sanitizers(address) queued 5-9 minutes for a free one. Running
  # both variants back-to-back on one runner drops the simultaneous request
  # count by one without changing what either variant builds, tests, or
  # asserts -- same two configure/build/test passes, same coverage, just
  # sequential instead of parallel. ccache is warm for the second pass
  # (same compiler, mostly-overlapping sources) as a side benefit.
  venue-optional:
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Observed: ~4 min (without-venue) + ~5 min (engine-only) run
    # sequentially now; was two ~4 min / ~5 min jobs on separate runners.
    # Since then about 20 min on a cold cache as the test suite grew, and
    # the 20-minute cap cancelled the job on main; 30 leaves a margin.
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ccache defaults to comparing the compiler binary's mtime, and
      # apt-get gives g++-14/clang-18 a fresh mtime on every ephemeral
      # runner -- so the mtime check "changes" on every run even though
      # the package (and its content) is identical, and ccache treats it
      # as a different compiler and misses everything. content hashes the
      # actual bytes instead, which is stable across runners. (sccache on
      # the Windows jobs already hashes content by default -- this brings
      # ccache in line with it.)
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libgtest-dev libgmock-dev ccache

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-gcc14-venue-optional-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-gcc14-venue-optional-

    - name: ccache zero stats
      run: ccache -z

    # LRVX_NATIVE=OFF on both configures below: see linux-gcc's identical
    # Configure step.
    - name: Configure without the venue
      run: |
        cmake -B build-without-venue -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_NATIVE=OFF \
              -DLRVX_BUILD_VENUE=OFF \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_BUILD_DEMO=ON \
              -DLRVX_ENABLE_BACKTEST=ON

    - name: Build without the venue
      run: cmake --build build-without-venue -j$(nproc)

    - name: Test without the venue
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build-without-venue

    - name: Verify nothing venue-side was built
      run: |
        test ! -f build-without-venue/venue/liblrvx-venue.a
        ! ctest --test-dir build-without-venue -N | grep -qE "Test +#[0-9]+: test_venue_(matcher|engine|ledger)"

    # Seconds, and it answers for every header at once. The Windows job
    # answers the same question eight minutes in and one header at a time,
    # because the compiler stops at the first.
    - name: Check the engine reaches no POSIX header unconditionally
      run: python3 scripts/check_engine_portability.py
    # Seconds as well, and it answers a question nothing else asks: the SBE
    # schemas exist to be read by somebody else's generator, and nothing in
    # this tree ever read them. Both were malformed XML for their whole life,
    # and one declared a message the codec had no template for.
    - name: Check the SBE schemas parse and the codec implements them
      run: python3 scripts/check_sbe_schema_implemented.py
    # A header that is installed is part of what find_package hands over. If
    # it reaches for a dependency the target does not declare, the consumer
    # finds out at their own build, with no indication of the cause -- and
    # nothing inside this tree can notice, because the dependency is present
    # here.
    - name: Check every installed header only needs what its target declares
      run: python3 scripts/check_installed_headers_declared.py

    - name: Configure with the engine and without the perimeter
      run: |
        cmake -B build-engine-only -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_NATIVE=OFF \
              -DLRVX_BUILD_VENUE=ON \
              -DLRVX_VENUE_PERIMETER=OFF \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_ENABLE_BACKTEST=ON

    - name: Build with the engine and without the perimeter
      run: cmake --build build-engine-only -j"$(nproc)"

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Test engine-only build
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build-engine-only

    - name: Verify the engine is here and the perimeter is not
      run: |
        test -f build-engine-only/venue/liblrvx-venue.a
        for t in matcher engine ledger checkpoint recovery conservation_fuzz differential_fuzz; do
          ctest --test-dir build-engine-only -N | grep -qE "test_venue_$t\b" \
            || { echo "::error::engine test test_venue_$t is missing from the engine-only build"; exit 1; }
        done
        for t in gateway fix_session md_distribution control_plane tls; do
          ! ctest --test-dir build-engine-only -N | grep -qE "test_venue_$t\b" \
            || { echo "::error::perimeter test test_venue_$t was built without the perimeter"; exit 1; }
        done

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  # Weekly deep run of the venue fuzzes. Pull requests run them at a
  # CI-friendly depth; this raises the command count by an order of magnitude,
  # which is where the rarer book divergences and reservation leaks surface.
  venue-deep-fuzz:
    if: github.event_name == 'schedule'
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Weekly-only; 2,000,000 fuzz ops is deliberately an order of magnitude
    # past the PR-time depth, so give it real headroom.
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libgtest-dev libgmock-dev

    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_BUILD_TESTS=ON \
              -DLRVX_ENABLE_BACKTEST=ON

    - name: Build the fuzz targets
      run: cmake --build build --target test_venue_differential_fuzz test_venue_conservation_fuzz -j$(nproc)

    - name: Differential fuzz (deep)
      env:
        LRVX_FUZZ_OPS: 2000000
      run: ./build/venue/test_venue_differential_fuzz

    - name: Conservation fuzz
      run: ./build/venue/test_venue_conservation_fuzz

  # The build profile a downstream consumer that runs the execution venue
  # configures: the venue engine, its perimeter, the FIX initiator and the
  # utilities those need. Nothing else in this tree is configured at all --
  # not the backtest module, not the exchange connectors, not the bindings,
  # not the demo or the benchmarks -- so none of their dependencies are
  # looked for either.
  #
  # Separate from venue-optional rather than folded into it: that job proves
  # the venue is optional, this one proves the REST of the tree is. They fail
  # for opposite reasons and neither one covers the other.
  #
  # What it asserts, in order of how much it would cost to find out later:
  # the closure of venue/lite_surface.txt reaches nowhere the profile forbids
  # (seconds, and it fails before a compiler starts); the consumer's 37
  # headers compile as one TU with the rest of the tree absent; the venue's
  # own suite -- golden replay included -- passes in that configuration.
  venue-lite:
    needs: [format-check]
    runs-on: ubuntu-24.04
    # Observed: ~7 min cold, ~2 min warm. The 5-minute warm ceiling in the
    # task this job came from is the number to watch.
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Same reason as venue-optional: apt-get gives the compiler a fresh
      # mtime on every ephemeral runner, and ccache's default mtime check
      # then misses everything.
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    # No libssl-dev, no libcurl, no zlib, no lz4: if this list ever has to
    # grow, the profile has stopped being lite and the diff says so.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libgtest-dev libgmock-dev ccache

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-gcc14-venue-lite-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-gcc14-venue-lite-

    - name: ccache zero stats
      run: ccache -z

    # Before the compiler, not after: a closure that has grown into
    # lrvx/backtest/ or lrvx/aggregator/ is a two-second answer.
    - name: Check the lite surface closure reaches nowhere it should not
      run: python3 scripts/lite_closure.py

    - name: Configure
      run: |
        cmake --preset venue-lite \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build-venue-lite -j"$(nproc)"

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Test
      run: ctest --preset venue-lite -j"$(nproc)"

    # The profile's claim is about what is NOT there. Assert it on the
    # artefacts rather than trusting the configure log.
    - name: Verify nothing outside the venue was built
      run: |
        test -f build-venue-lite/venue/liblrvx-venue.a
        test -f build-venue-lite/venue/venue_lite_surface
        for f in build-venue-lite/liblrvx_capi.so build-venue-lite/demo/demo; do
          test ! -e "$f" || { echo "::error::$f was built in the lite profile"; exit 1; }
        done
        ! ctest --test-dir build-venue-lite -N | grep -qE "Test +#[0-9]+: test_(backtest|indicator|replay)" \
          || { echo "::error::a core-suite test was configured in the lite profile"; exit 1; }
        ctest --test-dir build-venue-lite -N | grep -q "venue_lite_surface" \
          || { echo "::error::the surface contract was not configured"; exit 1; }

    # What the consumer actually takes. install(DIRECTORY include/) would put
    # the whole tree back, so the count is the assertion.
    - name: Verify the install surface is the closure and nothing else
      run: |
        cmake --install build-venue-lite --prefix "$PWD/lite-prefix" >/dev/null
        installed=$(find lite-prefix/include -name '*.h' -o -name '*.inl' | wc -l)
        expected=$(python3 scripts/lite_closure.py --paths | wc -l)
        echo "installed $installed headers, closure is $expected"
        test "$installed" -eq "$expected" \
          || { echo "::error::the lite profile installs $installed headers, the closure is $expected"; exit 1; }
        ! find lite-prefix/include -path '*/lrvx/backtest/*' -o -path '*/lrvx/aggregator/*' \
          -o -path '*/lrvx-connectors/*' | grep -q . \
          || { echo "::error::a forbidden directory reached the install surface"; exit 1; }

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  # venue-lite proves the PROFILE: LRVX_VENUE_LITE=ON in this checkout
  # configures, builds and tests nothing but the venue. It does not prove
  # the venue is *separable* -- that a tree containing only
  # scripts/mirror_paths.py's file list is a tree at all. That question is
  # this job's rehearsal before the venue core is cut into its own
  # repository: a first attempt at the cut (git filter-repo into a local copy) found two
  # things a header-only closure had not accounted for -- venue/src missing
  # entirely, and venue's own test suite needing headers no downstream
  # consumer's contract mentions (lrvx-venue/control_server.h, reached only
  # by test_venue_admin_surface). scripts/mirror_paths.py is the fix, and
  # this job is what keeps it honest: every push copies exactly its list
  # into a scratch directory, with the rest of this checkout unreachable,
  # and runs the same profile there.
  venue-lite-standalone:
    needs: [format-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      EXTRA_CMAKE_ARGS: >-
        -DCMAKE_CXX_COMPILER=g++-14
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libgtest-dev libgmock-dev ccache rsync

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-gcc14-venue-lite-standalone-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-gcc14-venue-lite-standalone-

    - name: ccache zero stats
      run: ccache -z

    # scripts/mirror_paths.py's own gate: the wider, venue-module closure it
    # walks (venue/src + venue/tests, minus the three the lite profile does
    # not build, + venue/benchmarks, union'd with the consumer contract)
    # must reach nowhere scripts/lite_closure.py's ALLOWED list forbids --
    # same rule, same two seconds, before rsync runs.
    - name: Check the mirror's wider closure reaches nowhere it should not
      run: python3 scripts/mirror_paths.py --summary >/dev/null

    - name: Copy the mirror paths into a scratch tree and run the profile there
      run: KEEP=1 scripts/lite_standalone_check.sh "${{ runner.temp }}/venue-core-standalone"

    # The claim is that nothing outside scripts/mirror_paths.py's list was
    # even copied, let alone built -- assert it on the scratch tree rather
    # than trusting the script's own count.
    - name: Verify the scratch tree has no forbidden directory and no stray files
      run: |
        scratch="${{ runner.temp }}/venue-core-standalone"
        ! find "$scratch/include" -path '*/lrvx/backtest/*' -o -path '*/lrvx/aggregator/*' \
          -o -path '*/lrvx-connectors/*' 2>/dev/null | grep -q . \
          || { echo "::error::a forbidden directory reached the standalone tree"; exit 1; }
        for d in python node connectors demo tools tests; do
          test ! -e "$scratch/$d" \
            || { echo "::error::$scratch/$d exists -- mirror_paths.py listed something it should not have"; exit 1; }
        done
        # Excludes build-venue-lite/: that is the profile's own build
        # output (object files, CMakeCache.txt, the test binaries), created
        # by the script's own build step, not part of what was copied in.
        # lite_standalone_check.sh already asserts source-file parity right
        # after the rsync, before anything is built; this re-checks the
        # same thing from outside the script, on what should be the same
        # set of files.
        mirrored=$(python3 scripts/mirror_paths.py | wc -l | tr -d ' ')
        present=$(find "$scratch" -type f -not -path "$scratch/build-venue-lite/*" | wc -l | tr -d ' ')
        test "$mirrored" -eq "$present" \
          || { echo "::error::mirror_paths.py lists $mirrored files, $present source files are in the scratch tree"; exit 1; }

    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
