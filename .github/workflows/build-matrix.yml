name: Build matrix

# Configures + builds lrvx in eight flag combinations on ubuntu-24.04.
# Each row exercises one option (or a small combination) in isolation
# so a default-OFF assumption can't silently rot. It cancels in progress
# on rapid pushes.
#
# This complements ci.yml — the latter handles the platform matrix
# (linux-clang/-gcc, macos, windows-msvc/-clang-cl) for the canonical
# "everything ON" build. build-matrix.yml is about flag isolation, not
# platform coverage.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No format-check here: ci.yml runs one, and duplicating it burned a third
  # clang-format job on every push. Formatting never breaks a build, so
  # gating the flag matrix on it bought nothing.
  matrix:
    runs-on: ubuntu-24.04
    # Observed: 1-3 min for most entries; tests-only 14 min cold and well
    # under that warm (with LTO on and no ccache, it ran past 20 min
    # relinking every test binary and was cancelled).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal-core
            flags: ""
            needs_gtest: false
            needs_pybind: false
          - name: tests-only
            flags: "-DLRVX_BUILD_TESTS=ON"
            needs_gtest: true
            needs_pybind: false
          - name: python-only
            flags: "-DLRVX_BUILD_PYTHON=ON -DLRVX_ENABLE_BACKTEST=ON"
            needs_gtest: false
            needs_pybind: true
          - name: capi-only
            flags: "-DLRVX_BUILD_CAPI=ON"
            needs_gtest: false
            needs_pybind: false
          - name: codon-only
            flags: "-DLRVX_BUILD_CODON=ON -DLRVX_BUILD_CAPI=ON"
            needs_gtest: false
            needs_pybind: false
          - name: quickjs-only
            flags: "-DLRVX_BUILD_QUICKJS=ON -DLRVX_BUILD_CAPI=ON"
            needs_gtest: false
            needs_pybind: false
          - name: connectors-bybit-only
            flags: "-DLRVX_BUILD_CONNECTORS=ON -DLRVX_CONNECTORS=bybit -DLRVX_ENABLE_POLYMARKET_ORDER_EXECUTOR=OFF"
            needs_gtest: false
            needs_pybind: false
          - name: production-typical
            flags: "-DLRVX_BUILD_PYTHON=ON -DLRVX_BUILD_CONNECTORS=ON -DLRVX_ENABLE_POLYMARKET_ORDER_EXECUTOR=OFF -DLRVX_ENABLE_BACKTEST=ON -DLRVX_ENABLE_LZ4=ON"
            needs_gtest: false
            needs_pybind: true
    name: ${{ matrix.name }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # See ci.yml: hash the compiler's bytes, not its mtime, so a fresh
      # apt-get on an ephemeral runner does not miss the whole cache.
      CCACHE_COMPILERCHECK: content
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build g++-14 ccache \
          libssl-dev zlib1g-dev libcurl4-openssl-dev liblz4-dev \
          python3-dev python3-pip

    # One cache per row, keyed like ci.yml's jobs; restore-keys falls back
    # to the newest cache for this row, which on a PR is main's. tests-only
    # compiled every test from scratch on every run and took 14 minutes of
    # its 20-minute limit cold.
    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-gcc14-matrix-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-gcc14-matrix-${{ matrix.name }}-

    - name: Install GoogleTest
      if: matrix.needs_gtest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_INSTALL_PREFIX=$HOME/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Install pybind11 + numpy
      if: matrix.needs_pybind
      # Pinned below 3.1.0 to match the committed .pyi (see ci.yml).
      run: python3 -m pip install --break-system-packages "pybind11<3.1.0" numpy

    - name: Resolve pybind11_DIR
      if: matrix.needs_pybind
      run: |
        echo "pybind11_DIR=$(python3 -c 'import pybind11; print(pybind11.get_cmake_dir())')" >> $GITHUB_ENV

    # LRVX_LTO=OFF: this matrix checks that each flag combination
    # configures and builds; the whole-program link step adds nothing to
    # that and dominated the tests-only row.
    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release \
              -DLRVX_LTO=OFF \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install" \
              ${{ matrix.flags }}

    - name: ccache zero stats
      run: ccache -z

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: ccache stats
      if: always()
      run: ccache -s

    # Main only; see ci.yml's linux-gcc Save ccache for why.
    - name: Save ccache
      if: always() && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    # Build the wheel from the root pyproject.toml, install it into a
    # throwaway venv, and assert every documented pure-Python module is
    # importable. Catches the regression where scikit-build-core only
    # collects the install component contents and silently drops new
    # `.py` files added under `python/lrvx/`. It lives here rather than in
    # ci.yml's linux-gcc because it rebuilds the extension from scratch,
    # two minutes that sat on the critical path of the slowest job.
    - name: Verify wheel ships every pure-Python module
      if: matrix.name == 'python-only'
      run: bash scripts/check_lrvx_wheel.sh

    - name: Venue-stack composition smoke
      if: matrix.name == 'python-only' || matrix.name == 'production-typical'
      run: |
        cd build/python && PYTHONPATH=. python3 ../../scripts/smoke_composition.py
