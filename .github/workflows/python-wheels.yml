name: Build Python wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (prod)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs on both triggers this workflow has (workflow_dispatch and a `v*`
  # tag push), so a tag push cannot skip the actor restriction the way a
  # job-level `if: ... == 'workflow_dispatch'` used to let it. Downstream
  # jobs key off `needs.check-actor.result == 'success'` with no
  # `always()`/skipped fallback, so if a future trigger is ever added here
  # without updating this `if`, the build fails closed instead of the
  # actor check silently becoming a no-op again.
  check-actor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      # The release workflow pushes the tag as the app, not as a person, so
      # the app is allowed on the tag path only. Publishing is gated by the
      # `release` environment's required approval, not by this step.
      - name: Restrict who can reach the publish path
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RELEASE_APP: "lrvx-release-bot[bot]"
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$ACTOR" != "eeiaao" ]; then
              echo "::error::only eeiaao can start this workflow by hand (actor: $ACTOR)"
              exit 1
            fi
          else
            if [ "$ACTOR" != "eeiaao" ] && [ "$ACTOR" != "$RELEASE_APP" ]; then
              echo "::error::a v* tag reaches the publish path only from eeiaao or $RELEASE_APP (actor: $ACTOR)"
              exit 1
            fi
          fi
          echo "actor '$ACTOR' is allowed for event '$EVENT'"

  # A tag can be pushed from anywhere; publishing must only ever happen for
  # one that is actually reachable from main, so a stray branch or an
  # accidental `git push --tags` from a feature branch cannot reach the
  # registry just because it matches `v*`.
  check-tag-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tag points at a commit on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.ref_name }} is not an ancestor of main -- refusing to publish from a tag that isn't on the main branch."
            exit 1
          fi

  # Publish must depend on the test suite actually having run against this
  # commit, not just on the wheel builds succeeding -- ci.yml's push trigger
  # is filtered to branches, so a tag push never runs it. This gives the tag
  # commit an independent, real pass/fail before anything is published.
  run-core-tests:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    # A cold build alone takes about 17 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: scripts/ci-apt-install.sh --no-install-recommends cmake ninja-build liblz4-dev

      - name: Install GoogleTest
        run: |
          git clone --depth=1 https://github.com/google/googletest.git
          cmake -B gtest-build -S googletest -G Ninja -DCMAKE_INSTALL_PREFIX="$HOME/gtest-install"
          cmake --build gtest-build
          cmake --install gtest-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$HOME/gtest-install" \
                -DLRVX_BUILD_TESTS=ON \
                -DLRVX_ENABLE_BACKTEST=ON \
                -DLRVX_ENABLE_LZ4=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run the core test suite
        run: ctest --output-on-failure --test-dir build

  build-wheels:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # cibuildwheel builds cp310-cp313 across three OSes; manylinux in
    # particular runs under emulation-adjacent container overhead.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      # The package root is the repository root: pyproject.toml lives there
      # so the sdist can carry the C++ sources (see build-sdist below). The
      # wheel it produces is unchanged -- `lrvx/` with the compiled
      # `_lrvx` inside it -- because the CMake python_module component
      # installs to `lrvx/`, which does not move with pyproject.toml.
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse .
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # lz4 is compiled into the extension (LRVX_VENDOR_LZ4): a wheel
          # then carries no copy of the build host's lz4, whose minimum OS
          # would otherwise become the wheel's.
          CIBW_ENVIRONMENT: 'SKBUILD_CMAKE_ARGS="-DLRVX_VENDOR_LZ4=ON"'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=14.0 SKBUILD_CMAKE_ARGS="-DLRVX_VENDOR_LZ4=ON"'
          CIBW_BUILD_VERBOSITY: 1
          # cibuildwheel installs the just-built wheel into a clean venv
          # and runs this from a temp directory (not the checkout), so a
          # pass here proves the wheel that would be published actually
          # loads its compiled extension and can run a real call through
          # it -- not just that the build step exited zero. `numpy` is
          # already a runtime dependency in pyproject.toml and gets
          # pulled in by installing the wheel; nothing extra to declare
          # via CIBW_TEST_REQUIRES.
          CIBW_TEST_COMMAND: >
            python -c "import lrvx; reg = lrvx.SymbolRegistry(); sid = reg.add_symbol('bybit', 'BTCUSDT', 0.01); assert lrvx.SLIPPAGE_NONE == 0; assert sid is not None; print('lrvx wheel smoke OK, symbol id:', sid)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Layout rule, and the reason pyproject.toml sits at the repository root:
  # an sdist can only contain files at or below the directory holding
  # pyproject.toml, so every source the build configures has to live under
  # that directory. With pyproject.toml in python/ and `cmake.source-dir`
  # pointing one level up, the tarball carried 192 files and neither
  # include/ nor src/ -- pip fell back to it on any platform or interpreter
  # the wheel matrix does not cover (linux aarch64, a Python newer than the
  # CIBW_BUILD list) and failed deep inside cmake with nothing to say the
  # sdist was the problem.
  #
  # So the gate below is not optional: it installs the tarball into a clean
  # venv, which runs a real cmake configure and compiles the core, and then
  # imports the extension -- the same shape as the wheel's CIBW_TEST_COMMAND
  # above. A tarball that does not carry what it tells cmake to build fails
  # here instead of on a user's machine.
  build-sdist:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    # The gate compiles the core from source, unlike every other job here
    # that only packages.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install what a source build needs
        run: scripts/ci-apt-install.sh --no-install-recommends cmake ninja-build liblz4-dev
      - run: pip install build
      - run: python -m build --sdist
      - name: Install the sdist in a clean venv and import it
        run: scripts/check_published_package.sh --sdist dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # lrvx-mcp is a pure-Python wheel — one cross-platform build covers
  # every interpreter/OS combination. Versioned lockstep with lrvx
  # (set-version.sh keeps mcp/pyproject.toml in sync). The bundled
  # data (`mcp/lrvx_mcp/data/`) is regenerated by sync_mcp_data.py and
  # committed, so the version users install matches the surface the
  # data describes — except docs.fts.sqlite, which is a pure function
  # of docs/ whose bytes vary with the libsqlite that wrote them: that
  # index is generated below and packaged, never committed.
  build-mcp:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify bundled data is in sync
        run: |
          pip install pyyaml libclang
          python scripts/sync_mcp_data.py --check
      - name: Generate docs.fts.sqlite into the package tree
        # The committed artifacts just passed --check, so this write
        # run only creates the FTS index; `python -m build` then packs
        # it into the sdist and the wheel via package-data.
        run: python scripts/sync_mcp_data.py
      - run: pip install build
      - run: python -m build mcp/
      - name: Assert the wheel packed the generated index
        # If the generate step above is ever skipped or reordered,
        # `python -m build` still succeeds -- the package-data glob
        # just matches nothing -- and the published wheel ships with
        # docs_search dead. Fail here instead.
        run: unzip -l mcp/dist/*.whl | grep -q "lrvx_mcp/data/docs.fts.sqlite"
      - uses: actions/upload-artifact@v4
        with:
          name: lrvx-mcp-dist
          path: mcp/dist/*

  publish-testpypi:
    needs: [build-wheels, build-sdist, build-mcp, run-core-tests, check-tag-on-main]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Registry publishing runs only inside the gated environment: the
    # trusted-publisher OIDC subject is pinned to it, so a token cannot be
    # minted from anywhere else.
    environment: registry
    # Same ref/input condition as publish-pypi below: without it, any
    # workflow_dispatch build -- including one run with publish_pypi=false,
    # i.e. "just build" -- published to TestPyPI unconditionally and burned
    # the version there for good.
    if: |
      always() &&
      needs.build-wheels.result == 'success' &&
      needs.build-sdist.result == 'success' &&
      needs.build-mcp.result == 'success' &&
      needs.run-core-tests.result == 'success' &&
      (needs.check-tag-on-main.result == 'success' || needs.check-tag-on-main.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_pypi == 'true')
    permissions:
      id-token: write
    steps:
      # Every artifact this workflow builds is publishable now that the
      # sdist installs, so one unfiltered download is what dist/ wants.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build-wheels, build-sdist, build-mcp, run-core-tests, check-tag-on-main]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Registry publishing runs only inside the gated environment: the
    # trusted-publisher OIDC subject is pinned to it, so a token cannot be
    # minted from anywhere else.
    environment: registry
    if: |
      always() &&
      needs.build-wheels.result == 'success' &&
      needs.build-sdist.result == 'success' &&
      needs.build-mcp.result == 'success' &&
      needs.run-core-tests.result == 'success' &&
      (needs.check-tag-on-main.result == 'success' || needs.check-tag-on-main.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_pypi == 'true')
    permissions:
      id-token: write
    steps:
      # See publish-testpypi above.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
