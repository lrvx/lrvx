name: codegen

on:
  # Same split ci.yml uses, and for the same reason. A feature branch has an
  # open PR, so an unrestricted push trigger checks every commit twice: once
  # for the push and once for the pull_request, on identical bytes. Measured
  # on 2026-09-19: 15 push runs against 11 pull_request runs in one day.
  #
  # main and audit-* get the push trigger because pushes there are PR merges
  # into a branch nothing opens a PR against -- without it those commits are
  # never checked on their own.
  push:
    branches: [main, 'audit-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen-check:
    runs-on: ubuntu-latest
    # Observed: 15-30s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # ABI gate scans recent commit messages for `BREAKING:`. Need full
          # history (or at least the PR's commits) to do that.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install codegen deps
        run: |
          scripts/ci-apt-install.sh --no-install-recommends clang-format
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r tools/codegen/requirements.txt
          python -m pip install --quiet pytest
          # The libclang PyPI package ships its own libclang shared lib, so we
          # don't need apt clang. clang (CLI) is needed for system-include-path
          # discovery; ubuntu-latest ships it. clang-format is needed by
          # emit_capi for format-stable output.

      - name: Verify all generated artifacts match the spec
        env:
          PYTHONPATH: tools/codegen
        run: |
          set -euo pipefail
          for pair in "emit-capi:lrvx_capi.h" "emit-codon:lrvx_capi.codon" "emit-llms:lrvx_capi.md"; do
            sub="${pair%%:*}"
            file="${pair#*:}"
            python -m lrvx_codegen.cli "$sub" \
              --spec include/lrvx/capi/lrvx_capi_spec.hpp \
              --out "/tmp/$file"
            if ! diff -u "tools/codegen/golden/$file" "/tmp/$file"; then
              echo "::error::tools/codegen/golden/$file is out of date"
              echo "Run: bash tools/codegen/scripts/regenerate.sh"
              exit 1
            fi
          done
          # The two layout artifacts are generated in place -- the C header is
          # included by tests/test_capi_event_layout.cpp and the Codon module
          # is imported by codon/lrvx/dispatch.codon -- so they are diffed
          # where they live rather than against a copy under golden/.
          for pair in "emit-layout-h:include/lrvx/capi/lrvx_capi_layout.h" \
                      "emit-layout-codon:codon/lrvx/layout.codon"; do
            sub="${pair%%:*}"
            file="${pair#*:}"
            python -m lrvx_codegen.cli "$sub" \
              --spec include/lrvx/capi/lrvx_capi_spec.hpp \
              --out "/tmp/$(basename "$file")"
            if ! diff -u "$file" "/tmp/$(basename "$file")"; then
              echo "::error::$file is out of date"
              echo "Run: bash tools/codegen/scripts/regenerate.sh"
              exit 1
            fi
          done

      - name: Verify function, macro, and struct-field equivalence with live lrvx_capi.h
        env:
          PYTHONPATH: tools/codegen
        run: |
          python -m lrvx_codegen.cli check \
            --expected include/lrvx/capi/lrvx_capi.h \
            --actual tools/codegen/golden/lrvx_capi.h \
            --require-full-coverage

      - name: ABI snapshot diff
        env:
          PYTHONPATH: tools/codegen
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # If a commit on this branch carries `BREAKING:` in its message,
          # accept ABI breaks. Otherwise, breaks fail the gate.
          #
          # On a PR, the range is the PR's own commits -- correct by
          # construction. On a push, it used to be a fixed HEAD~10..HEAD
          # window, which kept a BREAKING: label armed for the next nine
          # pushes after the one that carried it. Use the range GitHub
          # actually reports for this push (`before`..`sha`) instead, so the
          # label only covers the commits this push introduced. A missing or
          # zero `before` (new branch, or a history git can't resolve) falls
          # back to just the tip commit -- finding no BREAKING: there fails
          # closed into strict mode, same as today.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="origin/${GITHUB_BASE_REF}"
            range="$base..HEAD"
          elif [[ -n "${EVENT_BEFORE}" && "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            range="${EVENT_BEFORE}..${GITHUB_SHA}"
          else
            range="HEAD~1..HEAD"
          fi
          if git log --pretty=%B "$range" 2>/dev/null | grep -qE '^[[:space:]]*BREAKING:'; then
            echo "Found BREAKING: in commit messages — allowing ABI break."
            python -m lrvx_codegen.cli abi-diff \
              --snapshot .api/c-api.snapshot \
              --header include/lrvx/capi/lrvx_capi.h \
              --allow-breaking
          else
            python -m lrvx_codegen.cli abi-diff \
              --snapshot .api/c-api.snapshot \
              --header include/lrvx/capi/lrvx_capi.h
          fi

      - name: Run codegen unit tests
        env:
          PYTHONPATH: tools/codegen
        run: python -m pytest tools/codegen/tests/ -v
