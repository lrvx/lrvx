name: Publish lrvx-node

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish to npm"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs on both triggers this workflow has (workflow_dispatch and a `v*`
  # tag push), so a tag push cannot skip the actor restriction the way a
  # job-level `if: ... == 'workflow_dispatch'` used to let it. Downstream
  # jobs key off `needs.check-actor.result == 'success'` with no
  # `always()`/skipped fallback, so if a future trigger is ever added here
  # without updating this `if`, the build fails closed instead of the
  # actor check silently becoming a no-op again.
  check-actor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      # The release workflow pushes the tag as the app, not as a person, so
      # the app is allowed on the tag path only. Publishing is gated by the
      # `release` environment's required approval, not by this step.
      - name: Restrict who can reach the publish path
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RELEASE_APP: "lrvx-release-bot[bot]"
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$ACTOR" != "eeiaao" ]; then
              echo "::error::only eeiaao can start this workflow by hand (actor: $ACTOR)"
              exit 1
            fi
          else
            if [ "$ACTOR" != "eeiaao" ] && [ "$ACTOR" != "$RELEASE_APP" ]; then
              echo "::error::a v* tag reaches the publish path only from eeiaao or $RELEASE_APP (actor: $ACTOR)"
              exit 1
            fi
          fi
          echo "actor '$ACTOR' is allowed for event '$EVENT'"

  # A tag can be pushed from anywhere; publishing must only ever happen for
  # one that is actually reachable from main, so a stray branch or an
  # accidental `git push --tags` from a feature branch cannot reach the
  # registry just because it matches `v*`.
  check-tag-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tag points at a commit on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.ref_name }} is not an ancestor of main -- refusing to publish from a tag that isn't on the main branch."
            exit 1
          fi

  # Publish must depend on the test suite actually having run against this
  # commit, not just on the addon builds succeeding -- ci.yml's push trigger
  # is filtered to branches, so a tag push never runs it. This gives the tag
  # commit an independent, real pass/fail before anything is published.
  run-core-tests:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    # A cold build alone takes about 17 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: scripts/ci-apt-install.sh --no-install-recommends cmake ninja-build liblz4-dev

      - name: Install GoogleTest
        run: |
          git clone --depth=1 https://github.com/google/googletest.git
          cmake -B gtest-build -S googletest -G Ninja -DCMAKE_INSTALL_PREFIX="$HOME/gtest-install"
          cmake --build gtest-build
          cmake --install gtest-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$HOME/gtest-install" \
                -DLRVX_BUILD_TESTS=ON \
                -DLRVX_ENABLE_BACKTEST=ON \
                -DLRVX_ENABLE_LZ4=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run the core test suite
        run: ctest --output-on-failure --test-dir build

  build:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Same minimum macOS as the Python wheels (CIBW_ENVIRONMENT_MACOS).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: node
        run: npm install

      - name: Build lrvx + capi
        shell: bash
        run: |
          # LRVX_NATIVE=OFF is mandatory on distribution paths: it defaults
          # ON and adds -march=native, which is baked into the archive that
          # gets statically linked into the published .node and faults with
          # SIGILL on any consumer CPU missing an instruction the runner had.
          # python-wheels does this via pyproject.toml; this path did not.
          cmake -B build \
            -DLRVX_BUILD_CAPI=ON \
            -DLRVX_ENABLE_BACKTEST=ON \
            -DLRVX_NATIVE=OFF \
            -DLRVX_VENDOR_LZ4=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build node addon
        working-directory: node
        run: npm run build

      # The published addon must load on a machine with nothing but Node
      # installed: lz4 is compiled in (LRVX_VENDOR_LZ4), so no lz4 library
      # and nothing from the runner's package manager may be linked.
      - name: Addon links no lz4 and nothing from the build host
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          addon=$(find node/build -name lrvx_node.node | head -1)
          if [ "$RUNNER_OS" = "macOS" ]; then
            deps=$(otool -L "$addon" | tail -n +2)
          else
            deps=$(readelf -d "$addon" | grep NEEDED)
          fi
          echo "$deps"
          if echo "$deps" | grep -E -i 'lz4|/opt/homebrew|/usr/local'; then
            echo "::error::the addon depends on a library a user's machine does not have"
            exit 1
          fi

      - name: Copy prebuilt
        shell: bash
        run: |
          mkdir -p node/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          cp node/build/Release/lrvx_node.node \
             node/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/lrvx_node.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.platform }}-${{ matrix.arch }}
          # Upload the parent directory, not the per-platform directory
          # and not the .node file inside it. A single-file `path` makes
          # upload-artifact drop the containing directory, so the
          # artifact's root becomes a bare `lrvx_node.node` for every
          # matrix leg; three artifacts shaped that way collide on the
          # exact same path once merge-multiple flattens them below.
          # `node/prebuilds` at this point holds exactly one
          # `<platform>-<arch>/` subdirectory, so uploading it keeps
          # that subdirectory in the artifact and each of the three
          # artifacts gets a distinct root: `<platform>-<arch>/lrvx_node.node`.
          path: node/prebuilds

  publish:
    needs: [build, run-core-tests, check-tag-on-main]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Registry publishing runs only inside the gated environment: the
    # trusted-publisher OIDC subject is pinned to it, so a token cannot be
    # minted from anywhere else.
    environment: registry
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.run-core-tests.result == 'success' &&
      (needs.check-tag-on-main.result == 'success' || needs.check-tag-on-main.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_npm == 'true')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Upgrade npm for Trusted Publishing OIDC
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          path: node/prebuilds
          merge-multiple: true

      - name: Install package dependencies
        working-directory: node
        run: npm install

      - name: Verify the packed tarball actually installs and loads
        working-directory: node
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          tarball="$(ls lrvx-lrvx-*.tgz)"
          check_dir="$(mktemp -d)"
          cp "$tarball" "$check_dir/"
          rm -f "$tarball"
          pushd "$check_dir" >/dev/null
          npm init -y >/dev/null
          npm install "./$tarball"
          node -e "
            const lrvx = require('@lrvx/lrvx');
            const reg = new lrvx.SymbolRegistry();
            const sym = reg.addSymbol('bybit', 'BTCUSDT', 0.01);
            if (sym === undefined || sym === null) {
              throw new Error('native addon call returned nothing');
            }
            console.log('native addon loaded and callable, symbol id:', sym);
          "
          popd >/dev/null
          rm -rf "$check_dir"

      - name: Publish
        working-directory: node
        run: npm publish --access public --provenance
