[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrvx-mcp"
version = "0.12.0"
authors = [{name = "lrvx contributors"}]
description = "Model Context Protocol server for lrvx — gives AI agents grounded access to indicators, error codes, and the C API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["trading", "backtest", "indicators", "mcp", "ai", "claude", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0,<3",
    "lrvx>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lrvx-mcp = "lrvx_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/lrvx/lrvx"
Repository = "https://github.com/lrvx/lrvx"
Docs = "https://docs.lrvx.dev/"

[tool.setuptools.packages.find]
where = ["."]
include = ["lrvx_mcp*"]

[tool.setuptools.package-data]
lrvx_mcp = [
    "data/*.snapshot",
    "data/*.json",
    "data/*.sqlite",
    "data/errors/*.md",
    "data/templates/strategy/*/*.tmpl",
    "data/docs/examples/*.py",
    "data/docs/examples/*.js",
    "data/docs/examples/*.codon",
    "data/docs/examples/*.cpp",
]
