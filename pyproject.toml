[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lrvx"
version = "0.12.1"
authors = [{name = "lrvx contributors"}]
description = "Framework for building trading systems."
readme = "python/README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = [
    "trading",
    "backtest",
    "crypto",
    "perpetual",
    "cross-margin",
    "liquidation",
    "funding",
    "paper-trading",
    "live-trading",
    "ccxt",
    "venue-realistic",
    "execution",
    "market-making",
    "mcp",
    "ai-agent",
    "indicators",
    "technical-analysis",
    "walk-forward",
    "monte-carlo",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
ccxt = ["ccxt[pro]>=4.0"]
mlflow = ["mlflow>=2.0"]
mcp = ["mcp>=2.0,<3"]

[project.urls]
Homepage = "https://docs.lrvx.dev/"
Documentation = "https://docs.lrvx.dev/"
Repository = "https://github.com/lrvx/lrvx"
Issues = "https://github.com/lrvx/lrvx/issues"
Changelog = "https://github.com/lrvx/lrvx/releases"

[project.scripts]
lrvx = "lrvx.cli:main"

[tool.scikit-build]
# Layout rule: this file lives at the repository root, not in python/,
# because the sdist root is the directory that holds pyproject.toml and
# an sdist must carry every source CMake configures. The C++ core the
# extension links (include/, src/, venue/) sits above python/, and
# sdist.include patterns cannot reach outside the project root -- so a
# pyproject under python/ can only ever produce a tarball without the
# sources it tells CMake to build, which is exactly what shipped as
# flox_py-0.10.0.tar.gz: 192 files, no include/, no src/. Anything a
# `pip install <sdist>` configure step reads has to stay inside the
# tree this file roots; sdist.exclude below removes the rest, and the
# install-and-import gate in .github/workflows/python-wheels.yml is
# what proves the remainder is enough.
cmake.args = [
    "-DLRVX_ENABLE_BACKTEST=ON",
    "-DLRVX_BUILD_PYTHON=ON",
    "-DLRVX_ENABLE_LZ4=ON",
    # Wheels run on machines the build host knows nothing about; pin to
    # the portable x86-64-v3 baseline (or compiler-default on non-x86)
    # so the shipped .so does not require AVX-512 or other build-host-
    # specific instructions.
    "-DLRVX_NATIVE=OFF",
]
cmake.source-dir = "."
# Ship the package directory (pure-Python wrapper, .pyi stubs, py.typed
# marker). The compiled `_lrvx` extension is copied into this same
# directory by the python_module install component, which installs to
# `lrvx/` -- the wheel layout does not move with this file.
wheel.packages = ["python/lrvx"]
install.components = ["python_module"]
# What the sdist drops. Kept as a list of what is *not* built by
# `-DLRVX_BUILD_PYTHON=ON`, so the complement is "every input of that
# configure": CMakeLists.txt, cmake/, include/, src/, venue/ (the
# module is on by default and its sources are globbed at configure
# time), third_party/ (paired with src/quickjs) and python/ itself.
# Each entry is anchored at the root so python/tests and venue/tests
# are unaffected.
sdist.exclude = [
    "/.api",
    "/.github",
    "/benchmarks",
    "/codon",
    "/compat",
    "/connectors",
    "/demo",
    "/dist",
    "/docs",
    "/mcp",
    "/mirror",
    "/node",
    "/quickjs",
    "/scripts",
    "/tests",
    "/tools",
    "/glama.json",
    "/mkdocs.yml",
]
