  # DEX 256-bit amounts (u256 / i256). The boundary type for the AMM/DEX curves,
  # bound as a native bignum (Python int, Node BigInt).
  dex_amount:
    pybind11:
      status: required
      functions: [u256_roundtrip, i256_roundtrip, u256_from_hex]
    napi:
      status: required
      functions: [u256Roundtrip, i256Roundtrip, u256FromHex]
    codon: { status: required }
    quickjs:
      status: required
      reason: >
        QuickJS has no arbitrary-precision integer in the bound surface, so a 256-bit
        amount cannot round-trip through a JS number. Bind when the QuickJS layer
        grows a BigInt path.

  # AMM curves: price a DEX swap exactly from a binding. pybind11 exposes a class
  # (AmmCurve); napi exposes free functions over an opaque handle. Amounts are the
  # 256-bit dex_amount boundary.
  amm_curve:
    pybind11:
      status: required
      classes: [AmmCurve]
    napi:
      status: required
      functions:
        - ammCurveConstantProduct
        - ammCurveRaydiumCp
        - ammCurveUniswapV3
        - ammCurveTokenCount
        - ammCurveAmountOut
        - ammCurveApplySwap
        - ammCurveBalance
        - ammCurveSqrtPrice
        - ammCurveLiquidity
        - ammCurveClone
    codon: { status: required }
    quickjs:
      status: required
      reason: >
        Pricing needs 256-bit amounts, which the QuickJS bound surface has no BigInt
        for yet (see dex_amount). Bind the curves once that lands.

  # Pool-state tape replay: backtest a DEX strategy on recorded pool data. pybind11
  # exposes PoolTape / PoolReplay classes; napi exposes free functions over opaque
  # handles. Builds on the amm_curve + dex_amount boundary.
  pool_tape:
    pybind11:
      status: required
      classes: [PoolTape, PoolReplay]
    napi:
      status: required
      functions:
        - poolTapeCreate
        - poolTapeDescriptorConstantProduct
        - poolTapeDescriptorRaydiumCp
        - poolTapeDescriptorClmm
        - poolTapeCheckpoint
        - poolTapeSwap
        - poolTapeReplay
        - poolReplayDriftCount
        - poolReplayTradeCount
        - poolReplayCurve
    codon: { status: required }
    quickjs:
      status: required
      reason: >
        Replay returns 256-bit reserves, which the QuickJS bound surface has no BigInt
        for yet (see dex_amount / amm_curve). Bind once that lands.

  # ABI version and the thread's last error. Purely a C-level concern: every
  # other binding raises a native exception with the real message instead of
  # returning a failure value the caller then has to ask about, so surfacing
  # these would give a Python or JS user a second, weaker error channel next
  # to the one their language already has.
  capi_diagnostics:
    pybind11: { status: not_applicable }
    napi: { status: not_applicable }
    codon: { status: required }
    quickjs:
      status: required


## ── Per-function allowlist ───────────────────────────────────────────
##
## The functions each binding does not reach, with why. This is the honest
## inventory the gate checks against: a C function that is neither reachable
## from the binding nor listed here fails the gate, so a new C entry point
## cannot be added without either a wrapper or a line in this section.
##
## An entry is removed when the wrapper is written. See
## docs/contributors/parity-gate.md for the counts and what they mean.

allowlist_reasons:
  cpp_direct: &cpp_direct
    the Python binding wraps the C++ API directly rather than calling the C
    ABI, so this entry point has no call site under python/
  no_napi_wrapper: &no_napi_wrapper
    no call site under node/src/
  no_codon_import: &no_codon_import
    not imported by any module under codon/lrvx/
  no_quickjs_global: &no_quickjs_global
    no addGlobalFunc registration in src/quickjs/js_bindings.cpp reaches it
  quickjs_helper_only: &quickjs_helper_only
    called only inside other wrappers; no global of its own to map to

allowlist_functions:
  pybind11:
    lrvx_simulated_executor_begin_bar_callback_window: *cpp_direct
